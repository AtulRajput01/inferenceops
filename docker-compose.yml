services:

  ollama:
    image: ollama/ollama:latest
    container_name: inferenceops-ollama
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ./ollama:/root/.ollama

    networks:
      - inferenceops

    environment:
      - OLLAMA_HOST=0.0.0.0:11434

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s


networks:
  inferenceops:
    external: true
